<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ghost Remote</title>
<style>
:root {
  --bg:      #09090f;
  --surface: #111118;
  --border:  #1c1c2a;
  --accent:  #00ff88;
  --accent2: #00cc6a;
  --text:    #e0e0e0;
  --muted:   #55556a;
  --danger:  #ff4455;
  --warn:    #ffaa00;
  --r:       12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;
}
.page{display:none;width:100%;max-width:520px}
.page.active{display:block}

/* ── card ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:36px 32px;
  box-shadow:0 12px 48px rgba(0,0,0,.5);
}
.logo{text-align:center;margin-bottom:28px}
.logo h1{font-size:1.75rem;font-weight:700;color:var(--accent);letter-spacing:-.5px}
.logo p{color:var(--muted);font-size:.85rem;margin-top:5px}

/* ── form ── */
label{display:block;font-size:.75rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
input[type=text],input[type=password],select{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:.95rem;
  padding:11px 13px;outline:none;transition:border-color .2s;
  font-family:'Courier New',monospace;
}
input:focus{border-color:var(--accent)}
.field{margin-bottom:16px}

/* ── buttons ── */
.btn{
  display:block;width:100%;padding:13px;background:var(--accent);
  color:#000;border:none;border-radius:8px;font-size:.95rem;
  font-weight:700;cursor:pointer;transition:background .2s,transform .1s;
  letter-spacing:.03em;margin-top:4px;
}
.btn:hover{background:var(--accent2)}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#222;color:var(--muted);cursor:not-allowed}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);margin-top:10px}
.btn.secondary:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger:hover{background:#cc2233}

/* ── status ── */
.status{
  margin-top:18px;padding:14px;border-radius:8px;
  font-size:.875rem;display:none;
}
.status.ok{background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.2);color:var(--accent);display:block}
.status.err{background:rgba(255,68,85,.07);border:1px solid rgba(255,68,85,.2);color:var(--danger);display:block}
.status .row{display:flex;justify-content:space-between;margin-bottom:5px;font-size:.82rem}
.status .row span:first-child{color:var(--muted)}
.status .row span:last-child{font-weight:700}

/* ── downloads ── */
.downloads{margin-top:20px;display:none}
.downloads h3{font-size:.75rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.dl-btn{
  display:flex;align-items:center;gap:10px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:11px 14px;color:var(--text);
  text-decoration:none;font-size:.875rem;font-weight:600;
  transition:border-color .2s,background .2s;margin-bottom:8px;
}
.dl-btn:hover{border-color:var(--accent);background:rgba(0,255,136,.04);color:var(--accent)}
.dl-btn .badge{
  margin-left:auto;font-size:.7rem;font-weight:700;
  padding:2px 7px;border-radius:4px;
  background:rgba(0,255,136,.12);color:var(--accent);
}

/* ── admin ── */
.admin-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;
}
.admin-header h2{font-size:1.1rem;font-weight:700;color:var(--accent)}
.tag{font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:4px;
  background:rgba(0,255,136,.12);color:var(--accent)}

.key-list{margin-top:20px;max-height:320px;overflow-y:auto}
.key-item{
  background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:12px 14px;margin-bottom:8px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.key-item .key-str{
  font-family:'Courier New',monospace;font-size:.82rem;
  color:var(--accent);flex:1;min-width:0;word-break:break-all;
}
.key-item .key-meta{font-size:.72rem;color:var(--muted);white-space:nowrap}
.key-item .key-status{
  font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;
}
.key-item .key-status.active{background:rgba(0,255,136,.12);color:var(--accent)}
.key-item .key-status.revoked,.key-item .key-status.expired{background:rgba(255,68,85,.12);color:var(--danger)}
.revoke-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  border-radius:6px;padding:3px 9px;font-size:.72rem;cursor:pointer;
  transition:border-color .2s,color .2s;white-space:nowrap;
}
.revoke-btn:hover{border-color:var(--danger);color:var(--danger)}

.gen-result{
  margin-top:14px;padding:14px;border-radius:8px;display:none;
  background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.2);
}
.gen-result .new-key{
  font-family:'Courier New',monospace;font-size:1rem;
  color:var(--accent);font-weight:700;word-break:break-all;
  margin-bottom:6px;
}
.gen-result .copy-hint{font-size:.75rem;color:var(--muted)}

/* ── spinner ── */
.sp{display:inline-block;width:14px;height:14px;border:2px solid #333;
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .6s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

.sep{height:1px;background:var(--border);margin:20px 0}
.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:.75rem}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     PÁGINA PÚBLICA — /
══════════════════════════════════════════════ -->
<div id="pageStore" class="page active">
  <div class="card">
    <div class="logo">
      <h1>👻 Ghost Remote</h1>
      <p>Digite sua key para ativar o acesso</p>
    </div>

    <div class="field">
      <label for="keyInput">Sua Key</label>
      <input type="text" id="keyInput"
        placeholder="GHOST-XXXX-YYYY-ZZZZ"
        autocomplete="off" autocapitalize="characters" spellcheck="false"/>
    </div>

    <button class="btn" id="validateBtn" onclick="doValidate()">Validar Key</button>

    <div class="status" id="storeStatus"></div>

    <div class="downloads" id="downloadsBox">
      <h3>Downloads</h3>
      <a class="dl-btn" id="dlGlobal" href="#" target="_blank">
        <span>📦</span> Ghost Remote — Global <span class="badge">GLOBAL</span>
      </a>
      <a class="dl-btn" id="dlAP" href="#" target="_blank">
        <span>📦</span> Ghost Remote — AP <span class="badge">AP</span>
      </a>
    </div>
  </div>
  <div class="footer">Ghost Remote © 2026 — Acesso restrito a licenciados</div>
</div>

<!-- ══════════════════════════════════════════════
     LOGIN ADMIN — /admin
══════════════════════════════════════════════ -->
<div id="pageAdminLogin" class="page">
  <div class="card">
    <div class="logo">
      <h1>🔒 Admin</h1>
      <p>Acesso restrito</p>
    </div>

    <div class="field">
      <label for="adminPass">Token de Admin</label>
      <input type="password" id="adminPass"
        placeholder="••••••••"
        autocomplete="current-password"/>
    </div>

    <button class="btn" onclick="doAdminLogin()">Entrar</button>
    <div class="status" id="loginStatus"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════
     PAINEL ADMIN
══════════════════════════════════════════════ -->
<div id="pageAdmin" class="page">
  <div class="card">
    <div class="admin-header">
      <h2>👻 Painel Admin</h2>
      <span class="tag">ADMIN</span>
    </div>

    <!-- gerador -->
    <label>Gerar Nova Key</label>
    <div style="display:flex;gap:10px;margin-top:7px;flex-wrap:wrap">
      <div style="flex:1;min-width:140px">
        <select id="expirySelect" style="width:100%">
          <option value="30">30 dias</option>
          <option value="60">60 dias</option>
          <option value="90">90 dias</option>
          <option value="365">1 ano</option>
          <option value="0">Sem expiração</option>
        </select>
      </div>
      <button class="btn" style="width:auto;padding:11px 20px;margin-top:0"
        onclick="doGenerate()">⚡ Gerar</button>
    </div>

    <div class="gen-result" id="genResult">
      <div class="new-key" id="newKeyStr"></div>
      <div class="copy-hint">✅ Key gerada — toque para copiar</div>
    </div>

    <div class="sep"></div>

    <!-- lista de keys -->
    <div style="display:flex;align-items:center;justify-content:space-between">
      <label style="margin:0">Keys cadastradas</label>
      <button class="btn secondary" style="width:auto;padding:5px 12px;font-size:.8rem;margin:0"
        onclick="loadKeys()">↻ Atualizar</button>
    </div>

    <div class="key-list" id="keyList">
      <div style="text-align:center;color:var(--muted);padding:20px;font-size:.85rem">
        clique em Atualizar para carregar
      </div>
    </div>

    <div class="sep"></div>
    <button class="btn secondary" onclick="adminLogout()">Sair</button>
  </div>
</div>

<script>
// ── roteamento SPA simples ─────────────────────────────────────
let currentAdminToken = sessionStorage.getItem('adminToken') || '';

function route() {
  const path = location.pathname;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  if (path === '/admin' || path === '/admin/') {
    if (currentAdminToken) {
      show('pageAdmin');
      loadKeys();
    } else {
      show('pageAdminLogin');
    }
  } else {
    show('pageStore');
  }
}

function show(id) {
  document.getElementById(id).classList.add('active');
}

window.addEventListener('popstate', route);
route();

// ── helpers ────────────────────────────────────────────────────
function getHwid() {
  const raw = [navigator.userAgent, navigator.language,
    screen.width+'x'+screen.height, new Date().getTimezoneOffset()].join('|');
  let h = 5381;
  for (let i = 0; i < raw.length; i++) h = ((h<<5)+h) ^ raw.charCodeAt(i);
  return 'WEB-'+(h>>>0).toString(16).toUpperCase().padStart(8,'0');
}

function fmtDate(ms) {
  if (ms > 9000000000000) return 'Sem expiração';
  return new Date(ms).toLocaleDateString('pt-BR');
}

function setStatus(id, type, html) {
  const el = document.getElementById(id);
  el.className = 'status ' + type;
  el.innerHTML = html;
}

// ── STORE: validar key ─────────────────────────────────────────
async function doValidate() {
  const key  = document.getElementById('keyInput').value.trim();
  const btn  = document.getElementById('validateBtn');
  const hwid = getHwid();

  if (!key) { setStatus('storeStatus','err','❌ Digite uma key.'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="sp"></span>Validando...';
  document.getElementById('storeStatus').className = 'status';
  document.getElementById('downloadsBox').style.display = 'none';

  try {
    const r = await fetch('/api/validate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key, hwid})
    });
    const d = await r.json();

    if (d.success) {
      setStatus('storeStatus','ok',`
        <div class="row"><span>Status</span><span>✅ Ativa</span></div>
        <div class="row"><span>Expira em</span><span>${fmtDate(d.expiresAt)}</span></div>
        <div class="row"><span>HWID</span><span>${hwid}</span></div>
      `);

      const dr = await fetch('/api/download', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({key})
      });
      const dd = await dr.json();
      if (dd.success) {
        document.getElementById('dlGlobal').href = dd.links.global;
        document.getElementById('dlAP').href     = dd.links.ap;
        document.getElementById('downloadsBox').style.display = 'block';
      }
    } else {
      setStatus('storeStatus','err','❌ '+(d.error||'Key inválida.'));
    }
  } catch {
    setStatus('storeStatus','err','❌ Erro de conexão.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Validar Key';
  }
}

// formata key em maiúsculo ao digitar
document.getElementById('keyInput').addEventListener('input', function() {
  const p = this.selectionStart;
  this.value = this.value.toUpperCase();
  this.setSelectionRange(p,p);
});
document.getElementById('keyInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doValidate();
});

// ── ADMIN: login ───────────────────────────────────────────────
async function doAdminLogin() {
  const pass = document.getElementById('adminPass').value.trim();
  if (!pass) return;

  // verifica o token tentando listar as keys
  const r = await fetch('/api/admin/keys', {
    headers:{'x-admin-token': pass}
  });

  if (r.ok) {
    currentAdminToken = pass;
    sessionStorage.setItem('adminToken', pass);
    show('pageAdmin');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('pageAdmin').classList.add('active');
    loadKeys();
  } else {
    setStatus('loginStatus','err','❌ Token inválido.');
  }
}

document.getElementById('adminPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doAdminLogin();
});

function adminLogout() {
  currentAdminToken = '';
  sessionStorage.removeItem('adminToken');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  show('pageAdminLogin');
}

// ── ADMIN: gerar key ───────────────────────────────────────────
async function doGenerate() {
  const days = document.getElementById('expirySelect').value;
  const r = await fetch('/api/generate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({adminToken: currentAdminToken, expiresInDays: parseInt(days)})
  });
  const d = await r.json();

  if (d.success) {
    const box = document.getElementById('genResult');
    const str = document.getElementById('newKeyStr');
    str.textContent = d.key;
    box.style.display = 'block';

    // copia ao clicar
    box.onclick = () => {
      navigator.clipboard?.writeText(d.key).then(() => {
        box.querySelector('.copy-hint').textContent = '📋 Copiado!';
        setTimeout(() => box.querySelector('.copy-hint').textContent = '✅ Key gerada — toque para copiar', 2000);
      });
    };

    loadKeys();
  }
}

// ── ADMIN: listar keys ─────────────────────────────────────────
async function loadKeys() {
  const r = await fetch('/api/admin/keys', {
    headers:{'x-admin-token': currentAdminToken}
  });
  if (!r.ok) return;
  const d = await r.json();

  const list = document.getElementById('keyList');
  if (!d.keys.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;font-size:.85rem">Nenhuma key cadastrada</div>';
    return;
  }

  list.innerHTML = d.keys.slice().reverse().map(k => {
    const expired = Date.now() > k.expiresAt;
    const statusLabel = k.status !== 'active' ? k.status : (expired ? 'expired' : 'active');
    return `
      <div class="key-item">
        <span class="key-str">${k.key}</span>
        <span class="key-meta">${fmtDate(k.expiresAt)}</span>
        <span class="key-status ${statusLabel}">${statusLabel.toUpperCase()}</span>
        ${statusLabel === 'active'
          ? `<button class="revoke-btn" onclick="doRevoke('${k.key}')">Revogar</button>`
          : ''}
      </div>
    `;
  }).join('');
}

// ── ADMIN: revogar key ─────────────────────────────────────────
async function doRevoke(key) {
  if (!confirm(`Revogar ${key}?`)) return;
  await fetch('/api/admin/revoke', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({adminToken: currentAdminToken, key})
  });
  loadKeys();
}
</script>
</body>
  </html>
